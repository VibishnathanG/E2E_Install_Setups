MainSettings:
  PlayerSetting:
    position: taskbar_left_start
    monitor: 1
    playerWidth: 0 220
    playerHeight: 40 40
    playerMargin: 0 0
    autoSwitchSession: 1
    mirrorLayout: 0
    fullHeightHitArea: 1
  AlbumArtSetting:
    showAlbumArt: 1
    albumArtWidth: 30 60
    albumArtHeight: 30 30
    albumArtMargin: 0 0
  TextAreaSetting:
    showTrackTitle: 1
    showTrackArtist: 1
    textAreaWidth: 0 120
    textAreaHeight: 0 0
    textAreaMargin: 10 0
    textSpacing: 0
    enableTitleScrolling: 0
    enableArtistScrolling: 0
    scrollSpeed: 1
    scrollPauseDuration: 1000
    scrollMode: loop
    loopGap: 40
    swapTitleArtist: 0
    emptyTitleText: 📻Untitled
    noMediaTitleText: Not Playing
    emptyArtistText: ""
    noMediaArtistText: ""
  MediaButtonsSettings:
    showMediaButtons: 1
    mediaButtons:
      - prev
      - play
      - next
    mediaButtonsMargin: 2 2
    buttonSize: 28
    hideUnsupportedButtons: 0
  VisualizerFunctionsSettings:
    vizEnabled: 1
    vizPosition: left
    vizShape: mountain
    vizEQ: default
    vizAnchor: middle
    vizBarCountGap: 6 4
    vizBarSize: 1 8
    vizPadding: 0 0
    vizSensitivity: 300
AppearanceSettings:
  BackgroundStyleSettings:
    backgroundType: none
    solidColor: 35 35 35
    solidColor2: 35 35 35
    gradientColor2: 128 128 128
    solidOpacity: 100
    gradientAngle: 50
    gradientBalance: 50
    acrylicTintOpacity: 50
    micaOpacity: 50
    blurOpacity: 65
    blurRadius: 11
    cornerRadius: "40"
    enablePlayerHoverEffect: auto
    enableMediaButtonsHoverEffect: auto
    enableHoverAnimation: 1
  MediaButtonsStyleSettings:
    iconStyle: fluent_filled
    buttonSpacing: -5
    buttonIconSize: 12
    buttonCornerRadius: "4"
    buttonColor: 0 0 0$255 255 255
    buttonColorOpacity: 100
  TitleTextStyleSettings:
    titleColor: 0 0 0$255 255 255
    titleColorOpacity: 100
    titleFont: aptos
    titleFontSize: 12
    titleFontFamily: ""
    titleFontWeight: ""
    titleFontStyle: ""
    titleCharacterSpacing: 0
  ArtistTextStyleSettings:
    artistColor: 0 0 0$255 255 255
    artistColorOpacity: 80
    artistFont: segoe_ui_variable
    artistFontSize: 11
    artistFontFamily: ""
    artistFontWeight: ""
    artistFontStyle: ""
    artistCharacterSpacing: 0
  AlbumArtDisplaySettings:
    albumArtEmptyBehavior: show_icon
    emptyIconGlyph: E189
    emptyIconSize: 16
    emptyIconFont: segoe_fluent
    emptyIconColor: 140 140 140
    emptyIconOpacity: 100
    albumArtQuality: medium
    showPauseOverlay: 1
    pauseOverlayIconSize: 16
    pauseOverlayOpacity: 60
    albumArtOpacity: 100
    albumArtCornerRadius: "4"
    showAppIcon: 1
    appIconCorner: bottom_right
    appIconSize: 10
  VisualizerStyleSettings:
    vizColorMode: dynamic_album
    vizColor: 0 0 0$255 255 255
    vizColor1: 30 215 96
    vizColor2: 0 180 255
PlayerMenuSettings:
  placementMode: near
  PlayerMenuSettingsNear:
    miniPlayerHorizontalOffsetNear: 0
    miniPlayerVerticalPlacementNear: bottom
  PlayerMenuSettingsScreen:
    miniPlayerHorizontalPlacement: left
    horizontalDistanceFromScreenEdge: 0
    miniPlayerVerticalPlacement: bottom
    verticalDistanceFromScreenEdge: 0
    miniPlayerAnimation: auto
  keepMiniPlayerOpen: 0
  hideMediaSessionsList: 0
BehaviorSettings:
  disableAlbumArtClick: 0
  ClickActionSettings:
    - object: player
      click: left_click
      action: open_mini_player
    - object: player
      click: right_click
      action: open_context_menu
    - object: album_art
      click: left_double_click
      action: open_app
    - object: player
      click: middle_click
      action: switch_session
  MouseWheelActionSettings:
    - object: player
      click: mouse_wheel
      action: switch_tracks
    - object: album_art
      click: mouse_wheel
      action: switch_sessions
  hideWhenNoMedia: 1
  hideFullscreen: 1
  idleHideSeconds: 0
  showFullTitleOnHover: 1
AnimationSettings:
  enableSmoothPositionAnimation: 1
NotificationSettings:
  showSuccessNotification: 0
ContextMenuSettings:
  contextMenuItems:
    - switch_sessions
    - open_app
  repeatStyle: submenu
  shuffleStyle: toggle
  showOpenWindhawk: 1
  contextMenuIconStyle: as_media_buttons
  contextMenuIconColor: 0 0 0$255 255 255
  contextMenuIconOpacity: 100
DebugSettings:
  ignoredProcesses: ""
  enableTreeDump: 0
  showDebugBorders: 0
  showMiniPlayerBorder: 0
  showLayoutAnchors: 0
  showRestartButton: 0
