# ==============================================================================
# Omarchy Backup Configuration
# ==============================================================================

# Target backup root mount point (must be an ext4/btrfs mount supporting hardlinks)
BACKUP_ROOT="/mnt/backup"

# Number of rotating snapshot copies to keep
KEEP_SNAPSHOTS=3

# Primary user to backup
TARGET_USER="shadow"
TARGET_HOME="/home/shadow"

# Additional workspace folders to backup
# To add more folders in the future, simply add them to this array:
# WORKSPACES+=( "/Another_Workspace" )
WORKSPACES=(
    "/Main_Workspace"
)

# System configurations to preserve
SYSTEM_PATHS=(
    "/etc/sudoers.d"
    "/etc/systemd/system"
    "/etc/NetworkManager/system-connections"
    "/etc/locale.conf"
    "/etc/vconsole.conf"
    "/etc/hosts"
    "/etc/fstab"
    "/etc/environment"
)

# Exclude patterns (ephemeral caches, downloaded toolchains, build artifacts)
EXCLUDE_PATTERNS=(
    # Cache and temporary directories
    ".cache/**"
    ".cache"
    "cache/**"
    "Cache/**"
    "GPUCache/**"
    "Crashpad/**"
    "*.tmp"
    "*.log"
    ".local/share/Trash/**"
    ".local/state/nvim/swap/**"

    # Mise / runtime toolchain binaries (reinstalled via 'mise install')
    ".local/share/mise/installs/**"
    ".local/share/mise/downloads/**"

    # Browser storage & caches
    ".mozilla/**/cache2/**"
    ".mozilla/**/OfflineCache/**"
    ".zen/**/cache2/**"
    ".zen/**/storage/**"

    # Ephemeral developer / package build artifacts
    "node_modules/**"
    "__pycache__/**"
    ".venv/**"
    "venv/**"
    "target/**"
    ".terraform/**"

    # Package cache & system mounts
    "lost+found"
)
